name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
    # Feuert den Build ab, wenn du auf 'main' pushst

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # QEMU erlaubt es, ARM-Images (für Raspberry Pi) auf Intel-Servern zu bauen
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Baut für normale PCs (amd64) UND Raspberry Pi (arm64)
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hyundai-python-server:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hyundai-python-server:v1.2.0